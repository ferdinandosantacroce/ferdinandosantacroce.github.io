# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
# Output page's full content in RSS.
rssFullContent = true
favicon = "img/favicon.ico"

[footer]
since = 1979
customText = ""

[dateFormat]
published = ":date_long"
lastUpdated = ":date_long 15:04"

[sidebar]
emoji = ""
subtitle = "Uncovering better ways of developing software and organizations"
avatar = "img/avatar.png"

[article]
math = false
readingTime = true

[article.license]
enabled = true
default = "Licensed under CC BY-NC-SA 4.0"

## Widgets
[[widgets.homepage]]
type = "search"

[[widgets.homepage]]
type = "archives"

[widgets.homepage.params]
limit = 5

[[widgets.homepage]]
type = "categories"

[widgets.homepage.params]
limit = 10

[[widgets.homepage]]
type = "tag-cloud"

[widgets.homepage.params]
limit = 10

[[widgets.page]]
type = "toc"

[opengraph.twitter]
site = "https://ferdinandosantacroce.it"
card = "summary_large_image"

[colorScheme]
toggle = true
default = "auto"

[imageProcessing.thumbnail]
enabled = true

[imageProcessing.content]
enabled = true

