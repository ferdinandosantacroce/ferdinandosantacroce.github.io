name: Update theme

# Controls when the workflow will run
on:
  schedule:
    # Weekly, Monday 00:00 UTC. The theme is pre-1.0, so a daily bump is noise.
    - cron: "0 0 * * 1"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  update-theme:
    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # updated go.mod and go.sum back to the repository.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: go version

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Update theme
        run: hugo mod get -u github.com/CaiJimmy/hugo-theme-stack/v4

      - name: Tidy go.mod, go.sum
        run: hugo mod tidy

      # This build gates the commit: if the new theme breaks the site, the job
      # fails here and the change never reaches main.
      - name: Verify build
        run: hugo --minify --gc

      # The commit is never a publish: Nando pushes a separate publish commit
      # when he wants the site to go live.
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "CI: Update theme [ci skip]"
