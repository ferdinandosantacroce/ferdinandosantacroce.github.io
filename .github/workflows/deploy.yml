name: Deploy to Github Pages

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

# Deploys must never run concurrently: a late build could overwrite a newer one.
concurrency:
    group: pages-deploy-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            # Give the default GITHUB_TOKEN write permission to commit and push the
            # built site to the gh-pages branch.
            contents: write

        steps:
            - uses: actions/checkout@v7

            - name: Cache Hugo resources
              uses: actions/cache@v6
              env:
                  cache-name: cache-hugo-resources
              with:
                  path: resources
                  # A fresh key per run keeps restoring the latest cache while still
                  # saving the images processed by this build.
                  key: ${{ env.cache-name }}-${{ github.run_id }}
                  restore-keys: |
                      ${{ env.cache-name }}-

            - uses: actions/setup-go@v7
              with:
                  go-version: "1.27.x"
            - run: go version

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v3
              with:
                  hugo-version: "0.165.0"
                  extended: true

            - name: Build
              run: hugo --minify --gc

            # Runs after the build so internal links and images can be checked
            # against what Hugo actually produced.
            - name: Check content
              run: bash scripts/check-content.sh --site public

            # Pull requests only build, they never publish. This keeps a branch
            # preview from overwriting the live site on gh-pages.
            - name: Deploy 🚀
              if: github.event_name != 'pull_request'
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: gh-pages
                  folder: public
                  clean: true
                  single-commit: true
